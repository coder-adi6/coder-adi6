<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Hey, I'm Aditya">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F0C29"/><stop offset="0.5" stop-color="#302B63"/><stop offset="1" stop-color="#24243E"/>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#e4d4ff"/><stop offset="1" stop-color="#A972FF"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.14"/></pattern>
  <clipPath id="round"><rect width="1000" height="280" rx="20"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#dots)"/>
  <circle cx="200" cy="90" r="110" fill="#A972FF" opacity="0.5" filter="url(#blur)">
    <animate attributeName="cx" values="200;340;200" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;150;90" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="200" r="130" fill="#0A66C2" opacity="0.4" filter="url(#blur)">
    <animate attributeName="cy" values="200;80;200" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="820;700;820" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="30" r="80" fill="#FF6AD5" opacity="0.22" filter="url(#blur)">
    <animate attributeName="cx" values="560;640;560" dur="8s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1s" fill="freeze"/>
    <text x="500" y="128" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="url(#title)">Hey, I’m Aditya 👋
      <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    </text>
  </g>
  <text x="500" y="182" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3" fill="#d6ccff">SOFTWARE DEVELOPER  ·  FULL-STACK  ·  FINAL YEAR CS STUDENT
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1s" fill="freeze"/>
  </text>
  <text x="500" y="220" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2" fill="#9a90d6">Django  ·  React  ·  PostgreSQL  ·  NLP
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="1s" fill="freeze"/>
  </text>
</g>
<rect x="1" y="1" width="998" height="278" rx="20" fill="none" stroke="#A972FF" stroke-opacity="0.4" stroke-width="2"/>
<rect x="1" y="1" width="998" height="278" rx="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" pathLength="1000" stroke-dasharray="90 910">
  <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" repeatCount="indefinite"/>
</rect>
</svg>