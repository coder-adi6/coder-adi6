<svg xmlns="http://www.w3.org/2000/svg" width="150" height="42" viewBox="0 0 150 42" role="img" aria-label="GitHub">
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#30363d"/><stop offset="1" stop-color="#161b22"/></linearGradient>
  <clipPath id="r"><rect width="150" height="42" rx="21"/></clipPath>
</defs>
<g clip-path="url(#r)">
  <rect width="150" height="42" fill="url(#b)"/>
  <rect x="-50" y="-5" width="28" height="60" fill="#ffffff" opacity="0.22" transform="skewX(-20)">
    <animate attributeName="x" values="-50;200;200" keyTimes="0;0.4;1" dur="4s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="1" y="1" width="148" height="40" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
<text x="75" y="27" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">GitHub</text>
</svg>